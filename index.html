<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 챗봇 & 에코 다이어리 매니저</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      background: linear-gradient(135deg, #e3f2fd, #fce4ec);
      font-family: Arial, sans-serif; color: #333;
    }
    .container {
      width: min(900px, 92%); margin: 40px auto;
      background: #ffffff; border-radius: 24px; padding: 28px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.16);
    }
    h1 { margin: 0 0 8px; text-align: center; font-size: 28px; }
    .subtitle { text-align: center; color: #777; margin-bottom: 28px; font-size: 14px; }
    
    /* 인증 폼 스타일 */
    .auth-box { max-width: 420px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
    input, textarea, select { height: 46px; padding: 0 14px; border: 1px solid #ddd; border-radius: 12px; font-size: 15px; outline: none; }
    input:focus, textarea:focus, select:focus { border-color: #42a5f5; box-shadow: 0 0 0 3px rgba(66, 165, 245, 0.15); }
    textarea { min-height: 100px; padding: 14px; resize: vertical; font-family: Arial, sans-serif; }
    
    /* 버튼 스타일 */
    button { border: none; border-radius: 12px; padding: 0 16px; height: 46px; font-size: 15px; cursor: pointer; transition: 0.15s; font-weight: bold; }
    button:hover { transform: translateY(-2px); opacity: 0.9; }
    button:disabled { cursor: not-allowed; opacity: 0.6; transform: none; }
    
    .login-btn { background: #42a5f5; color: white; }
    .signup-btn { background: #7e57c2; color: white; }
    .logout-btn { background: #455a64; color: white; }
    .ask-btn { background: #2196f3; color: white; }
    .tts-btn { background: #ffb74d; color: #5d4037; }
    .delete-btn { background: #ef5350; color: white; padding: 0 12px; height: 36px; font-size: 13px; }
    
    /* 레이아웃 구조 */
    .top-bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 22px; padding: 14px; border-radius: 16px; background: #f7f9fb; }
    .user-info { font-size: 14px; font-weight: bold; color: #555; }
    .chat-section { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px; }
    @media (max-width: 768px) { .chat-section { grid-template-columns: 1fr; } }
    
    .panel { display: flex; flex-direction: column; gap: 10px; }
    .label { font-weight: bold; font-size: 15px; color: #444; }
    .answer-box { min-height: 100px; flex: 1; padding: 14px; border-radius: 12px; background: #f7f9fb; border: 1px solid #edf1f5; line-height: 1.6; white-space: pre-wrap; word-break: break-word; font-size: 15px; }
    .status { min-height: 20px; color: #666; font-size: 13px; margin: 4px 0; text-align: right; }
    
    /* 리스트 및 히스토리 스타일 */
    .list { display: flex; flex-direction: column; gap: 12px; border-top: 2px solid #edf1f5; padding-top: 20px; }
    .list-title { font-size: 18px; font-weight: bold; margin-bottom: 10px; }
    .item { display: flex; justify-content: space-between; align-items: center; padding: 16px; border-radius: 16px; background: #f9fbe7; border: 1px solid #f0f4c3; gap: 12px; }
    .item-body { flex: 1; }
    .item-title { margin: 0 0 6px; font-size: 16px; font-weight: bold; color: #33691e; }
    .item-content { margin: 0; color: #555; font-size: 14px; line-height: 1.5; }
    .item-date { margin-top: 6px; font-size: 11px; color: #999; }
    .empty { text-align: center; padding: 30px; color: #888; background: #f7f9fb; border-radius: 16px; }
    .hidden { display: none !important; }
    .notice { max-width: 420px; margin: 20px auto 0; padding: 14px; border-radius: 14px; background: #fff8e1; color: #6d4c41; font-size: 13px; line-height: 1.6; text-align: center; }
  </style>
</head>
<body>
  <div class="container">
    <h1>AI 챗봇 & 에코 매니저</h1>
    <div class="subtitle">Firebase Auth + Realtime DB + ChatGPT API + Web TTS 통합</div>

    <section id="authSection">
      <div class="auth-box">
        <input id="emailInput" type="email" placeholder="이메일 주소" />
        <input id="passwordInput" type="password" placeholder="비밀번호 (6자리 이상)" />
        <button class="login-btn" id="loginBtn">로그인</button>
        <button class="signup-btn" id="signupBtn">회원가입</button>
      </div>
      <div class="notice">
        처음 사용 시 이메일과 비밀번호를 적고 [회원가입]을 눌러주세요.
      </div>
    </section>

    <section id="mainSection" class="hidden">
      <div class="top-bar">
        <div class="user-info">접속 계정: <span id="userEmail"></span></div>
        <button class="logout-btn" id="logoutBtn">로그아웃</button>
      </div>

      <div class="chat-section">
        <div class="panel">
          <div class="label">상담할 질문 또는 쓰레기 이름 입력</div>
          <textarea id="questionInput" placeholder="예: 컵라면 용기는 어떻게 분리배출 하나요?"></textarea>
          
          <div class="label" style="margin-top: 8px;">음성 안내 목소리 선택</div>
          <select id="voiceSelect">
            <option value="">브라우저 기본 음성</option>
          </select>
          
          <button class="ask-btn" id="askBtn">AI에게 물어보기 (Ctrl + Enter)</button>
        </div>
        
        <div class="panel">
          <div class="label">AI 분석 답변 결과</div>
          <div id="answerBox" class="answer-box">질문을 입력하면 실시간 AI 가이드가 작동합니다.</div>
          <button class="tts-btn" id="ttsBtn" disabled>🔊 답변 음성으로 듣기</button>
        </div>
      </div>

      <div id="status" class="status"></div>

      <div class="list">
        <div class="list-title">🌱 나의 AI 질문 및 활동 기록</div>
        <div id="dataList"></div>
      </div>
    </section>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
    import { getDatabase, ref, push, set, remove, onValue, off } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js';

    // ================= [내 파이어베이스 정보로 연동하는 설정 구역] =================
    const firebaseConfig = {
      apiKey: 'AIzaSyDO-v52Ehwphh5gW0WBzu9_DliMhOzy4Yo', // 👈 본인의 진짜 API Key를 적어주세요.
      authDomain: 'kang-f4e85.firebaseapp.com',
      databaseURL: 'https://kang-f4e85-default-rtdb.firebaseio.com', // 👈 Realtime DB 주소 확인
      projectId: 'kang-f4e85',
      storageBucket: 'kang-f4e85.firebasestorage.app',
      messagingSenderId: '107057126084',
      appId: '1:107057126084:web:30f7bcb3f25dd2aa4a0791'
    };
    
    // Google Apps Script 웹앱 URL (ChatGPT 중계 서버)
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyTS-n6dNxhXGHxck-BL97z9l2PPrqZbl0tqjtPIP44MVFtyOiTwizk4jva8GMuV38p/exec';
    // ==============================================================================

    // 파이어베이스 시스템 시작
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const database = getDatabase(app);

    // DOM 객체 가져오기
    const authSection = document.getElementById('authSection');
    const mainSection = document.getElementById('mainSection');
    const emailInput = document.getElementById('emailInput');
    const passwordInput = document.getElementById('passwordInput');
    const loginBtn = document.getElementById('loginBtn');
    const signupBtn = document.getElementById('signupBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const userEmail = document.getElementById('userEmail');
    
    const questionInput = document.getElementById('questionInput');
    const answerBox = document.getElementById('answerBox');
    const askBtn = document.getElementById('askBtn');
    const ttsBtn = document.getElementById('ttsBtn');
    const voiceSelect = document.getElementById('voiceSelect');
    const dataList = document.getElementById('dataList');
    const statusBox = document.getElementById('status');

    let currentUser = null;
    let currentItemsRef = null;
    let lastAiResponse = ""; 

    function setStatus(msg) { statusBox.textContent = msg; }

    // 1. 회원가입 및 로그인 제어인터페이스
    function getAccountInfo() {
      const email = emailInput.value.trim();
      const password = passwordInput.value.trim();
      if (!email || !password) { alert('이메일과 비밀번호를 모두 입력해주세요.'); return null; }
      if (password.length < 6) { alert('비밀번호는 안전을 위해 6자리 이상 설정하세요.'); return null; }
      return { email, password };
    }

    signupBtn.addEventListener('click', async () => {
      const info = getAccountInfo(); if (!info) return;
      try {
        await createUserWithEmailAndPassword(auth, info.email, info.password);
        alert('회원가입 완료! 자동 로그인됩니다.');
      } catch (err) { alert(getKoreanErrorMessage(err.code)); }
    });

    loginBtn.addEventListener('click', async () => {
      const info = getAccountInfo(); if (!info) return;
      try { await signInWithEmailAndPassword(auth, info.email, info.password); } 
      catch (err) { alert(getKoreanErrorMessage(err.code)); }
    });

    logoutBtn.addEventListener('click', () => signOut(auth).catch(() => alert('로그아웃 실패')));

    // 인증 유저 변경 리스너
    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUser = user;
        authSection.classList.add('hidden');
        mainSection.classList.remove('hidden');
        userEmail.textContent = user.email;
        emailInput.value = ''; passwordInput.value = '';
        startRealtimeListener(user.uid);
      } else {
        currentUser = null;
        authSection.classList.remove('hidden');
        mainSection.classList.add('hidden');
        stopRealtimeListener();
      }
    });

    // 2. Realtime Database 실시간 리스너 연결
    function startRealtimeListener(uid) {
      stopRealtimeListener();
      setStatus('기록 데이터를 가져오는 중...');
      currentItemsRef = ref(database, `users/${uid}/items`);

      onValue(currentItemsRef, (snapshot) => {
        renderData(snapshot.val());
        setStatus('클라우드 동기화 완료 ✨');
      }, (err) => {
        console.error(err);
        setStatus('보안 정책 오류: 규칙 설정을 확인하세요.');
      });
    }

    function stopRealtimeListener() {
      if (currentItemsRef) { off(currentItemsRef); currentItemsRef = null; }
      dataList.innerHTML = '';
    }

    // 3. ChatGPT 호출 및 데이터베이스 기록 동시 수행
    askBtn.addEventListener('click', askChatGPT);
    
    async function askChatGPT() {
      const question = questionInput.value.trim();
      if (!question) { alert('질문을 입력해주세요.'); return; }
      if (!currentUser) return;

      try {
        askBtn.disabled = true;
        askBtn.textContent = 'AI 분석 중...';
        answerBox.textContent = '생성 AI 알고리즘 작동 중입니다... 잠시만 기다려주세요.';
        ttsBtn.disabled = true;

        // Apps Script 통신 요청
        const response = await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify({ question: question })
        });
        const data = await response.json();
        if (data.error) throw new Error(data.error);

        const answer = data.answer || '답변 수신 실패';
        answerBox.textContent = answer;
        lastAiResponse = answer; 
        ttsBtn.disabled = false; // 음성 가이드 활성화

        // 실시간 데이터베이스에 축적 저장
        const newItemRef = push(ref(database, `users/${currentUser.uid}/items`));
        await set(newItemRef, {
          title: question,
          content: answer,
          createdAt: new Date().toLocaleString('ko-KR')
        });

        questionInput.value = '';
      } catch (err) {
        console.error(err);
        answerBox.textContent = '오류 발생: ' + err.message;
      } finally {
        askBtn.disabled = false;
        askBtn.textContent = 'AI에게 물어보기 (Ctrl + Enter)';
      }
    }

    // 4. 데이터 렌더링 화면 설계 및 삭제 기능 구현
    function renderData(data) {
      dataList.innerHTML = '';
      if (!data) {
        dataList.innerHTML = '<div class="empty">기록된 상담 이력이 없습니다. 질문을 등록해 보세요!</div>';
        return;
      }

      Object.entries(data).reverse().forEach(([id, item]) => {
        const div = document.createElement('div');
        div.className = 'item';
        div.innerHTML = `
          <div class="item-body">
            <p class="item-title">🔍 질문: ${escapeHTML(item.title || '')}</p>
            <p class="item-content">${escapeHTML(item.content || '').replace(/\n/g, '<br>')}</p>
            <div class="item-date">기록일시: ${item.createdAt || '-'}</div>
          </div>
          <button class="delete-btn" data-id="${id}">삭제</button>
        `;
        // 동적 엘리먼트에 삭제 기능 직접 매핑
        div.querySelector('.delete-btn').addEventListener('click', () => deleteItem(id));
        dataList.appendChild(div);
      });
    }

    async function deleteItem(id) {
      if (!currentUser || !confirm('이 기록을 영구 삭제하시겠습니까?')) return;
      try {
        await remove(ref(database, `users/${currentUser.uid}/items/${id}`));
      } catch (err) {
        alert('삭제 처리에 실패했습니다.');
      }
    }

    // 5. AI TTS 기능 구현 (Web Speech API)
    let voices = [];
    function loadVoices() {
      voices = window.speechSynthesis.getVoices();
      voiceSelect.innerHTML = '<option value="">브라우저 기본 한국어 성우</option>';
      voices.forEach((voice) => {
        if (voice.lang.includes('ko') || voice.lang.includes('KO')) {
          const option = document.createElement('option');
          option.value = voice.name;
          option.textContent = `${voice.name} (${voice.lang})`;
          voiceSelect.appendChild(option);
        }
      });
    }
    
    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = loadVoices;
      loadVoices();
    }

    ttsBtn.addEventListener('click', () => {
      if (!lastAiResponse) return;
      window.speechSynthesis.cancel(); // 실행 중인 기존 음성 음소거

      const utterance = new SpeechSynthesisUtterance(lastAiResponse);
      const selectedVoiceName = voiceSelect.value;
      if (selectedVoiceName) {
        utterance.voice = voices.find(v => v.name === selectedVoiceName);
      }
      utterance.lang = 'ko-KR';
      utterance.rate = 1.0; // 속도 비율 배수
      window.speechSynthesis.speak(utterance);
    });

    // 헬퍼 단축키 및 보안 처리 함수들
    function escapeHTML(text) {
      return String(text).replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll('"', '&quot;').replaceAll("'", '&#039;');
    }

    function getKoreanErrorMessage(code) {
      switch (code) {
        case 'auth/email-already-in-use': return '이미 가입된 이메일입니다.';
        case 'auth/invalid-email': return '이메일 주소의 형식이 맞지 않습니다.';
        case 'auth/weak-password': return '비밀번호 강도가 낮습니다. 6자 이상 입력해 주세요.';
        case 'auth/invalid-credential': return '이메일 혹은 비밀번호 정보가 정확하지 않습니다.';
        default: return `인증 시스템 에러 코드: ${code}`;
      }
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && e.ctrlKey && document.activeElement === questionInput) {
        askChatGPT();
      }
    });
  </script>
</body>
</html>
