<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>지구 구조대 - AI 분리배출 가이드</title>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
  
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; justify-content: center; align-items: center;
      background: linear-gradient(135deg, #e8f5e9, #c8e6c9); font-family: Arial, sans-serif;
    }
    .app-container { width: 360px; padding: 24px; border-radius: 24px; background: #ffffff; box-shadow: 0 15px 35px rgba(0, 0, 0, 0.12); }
    h1 { margin: 0 0 8px; text-align: center; font-size: 26px; color: #2e7d32; }
    .subtitle { text-align: center; font-size: 14px; color: #666; margin-bottom: 20px; }
    #login-view { display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 20px 0; }
    #main-view { display: none; }
    .user-info { display: flex; justify-content: space-between; align-items: center; background: #f1f8e9; padding: 10px 14px; border-radius: 12px; font-size: 14px; margin-bottom: 16px; }
    .score-box { font-weight: bold; color: #388e3c; }
    .search-box { display: flex; gap: 8px; margin-bottom: 16px; }
    input[type="text"] { flex: 1; height: 48px; padding: 0 12px; border: 2px solid #a5d6a7; border-radius: 12px; font-size: 16px; outline: none; }
    input[type="text"]:focus { border-color: #2e7d32; }
    button { height: 48px; padding: 0 16px; border: none; border-radius: 12px; font-size: 15px; font-weight: bold; cursor: pointer; transition: 0.15s; }
    .btn-main { background: #4caf50; color: white; }
    .btn-main:hover { background: #388e3c; transform: translateY(-2px); }
    .btn-sub { background: #f5f5f5; color: #333; border: 1px solid #ddd; }
    .btn-sub:hover { background: #eeeeee; }
    .result-card { background: #f9f9f9; border-radius: 16px; padding: 16px; min-height: 100px; margin-bottom: 16px; font-size: 14px; line-height: 1.6; color: #333; border: 1px solid #e0e0e0; }
    .tts-area { display: flex; justify-content: flex-end; margin-bottom: 16px; }
    .btn-tts { background: #ffb74d; color: #5d4037; display: none; }
    .history-section { border-top: 1px solid #eee; padding-top: 12px; }
    .history-title { font-size: 14px; font-weight: bold; color: #555; margin-bottom: 8px; }
    .history-list { list-style: none; padding: 0; margin: 0; max-height: 120px; overflow-y: auto; font-size: 13px; color: #666; }
    .history-item { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px dashed #f0f0f0; }
  </style>
</head>
<body>

  <div class="app-container">
    <h1>지구 구조대 🌍</h1>
    <div class="subtitle">AI 분리배출 가이드 & 에코 다이어리</div>

    <div id="login-view">
      <p>지구를 구하는 첫걸음, 로그인이 필요합니다.</p>
      <button class="btn-main" onclick="login()">구글 계정으로 시작하기</button>
    </div>

    <div id="main-view">
      <div class="user-info">
        <span id="user-name">내 이름</span>
        <span class="score-box">🌱 <span id="user-score">0</span> 💚</span>
      </div>

      <div class="search-box">
        <input type="text" id="trash-input" placeholder="예: 컵라면 용기, 치킨 뼈" onkeydown="if(event.key==='Enter') searchTrash()" />
        <button class="btn-main" onclick="searchTrash()">검색</button>
      </div>

      <div class="result-card" id="result-display">
        버릴 쓰레기를 검색하면 AI가 완벽한 분리배출 방법을 안내해 드립니다!
      </div>

      <div class="tts-area">
        <button class="btn-tts" id="tts-btn" onclick="speakResult()">🔊 음성으로 안내 받기</button>
      </div>

      <div class="history-section">
        <div class="history-title">나의 에코 실천 기록</div>
        <ul class="history-list" id="history-list"></ul>
      </div>

      <button class="btn-sub" style="width: 100%; margin-top: 16px;" onclick="logout()">로그아웃</button>
    </div>
  </div>

  <script>
    // ================= [설정 영역: 본인의 파이어베이스 키값으로 채우기] =================
    const firebaseConfig = {
      apiKey: "YOUR_FIREBASE_API_KEY", // 👈 위에 설명한 2번 과정에서 복사한 진짜 키를 여기에 넣으세요!
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com", // 👈 Realtime DB는 이 주소 한 줄이 추가로 필요합니다! 콘솔에서 확인 가능해요.
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_MESSAGING_ID",
      appId: "YOUR_APP_ID"
    };
    
    const OPENAI_API_KEY = "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";
    // ========================================================================

    // 파이어베이스 초기화
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database(); // Realtime DB 인스턴스 생성

    let currentUser = null;
    let currentAiResponse = "";

    // 인증 상태 감지
    auth.onAuthStateChanged((user) => {
      if (user) {
        currentUser = user;
        document.getElementById('login-view').style.display = 'none';
        document.getElementById('main-view').style.display = 'block';
        document.getElementById('user-name').innerText = user.displayName + " 대원";
        loadUserData();
      } else {
        currentUser = null;
        document.getElementById('login-view').style.display = 'flex';
        document.getElementById('main-view').style.display = 'none';
      }
    });

    function login() {
      const provider = new firebase.auth.GoogleAuthProvider();
      auth.signInWithPopup(provider).catch(err => alert("로그인 실패: " + err.message));
    }

    function logout() { auth.signOut(); }

    // 🌟 변경됨: Realtime DB 읽기 전용 함수
    function loadUserData() {
      if (!currentUser) return;
      
      // 유저의 에코 점수 실시간 연동
      db.ref("users/" + currentUser.uid + "/score").on("value", (snapshot) => {
        const score = snapshot.val();
        document.getElementById('user-score').innerText = score !== null ? score : 0;
      });

      // 최근 검색 기록 5개 실시간 연동
      db.ref("users/" + currentUser.uid + "/history").limitToLast(5).on("value", (snapshot) => {
        const listEl = document.getElementById('history-list');
        listEl.innerHTML = "";
        
        const records = [];
        snapshot.forEach((childSnapshot) => {
          records.unshift(childSnapshot.val()); // 최신 내용이 위로 가도록 정렬
        });

        records.forEach((data) => {
          listEl.innerHTML += `<li class="history-item"><span>🔍 ${data.item}</span><span>+10p</span></li>`;
        });
      });
    }

    async function searchTrash() {
      const inputEl = document.getElementById('trash-input');
      const query = inputEl.value.trim();
      if (!query) return;

      const resultDisplay = document.getElementById('result-display');
      const ttsBtn = document.getElementById('tts-btn');
      
      resultDisplay.innerText = "AI가 분리배출 방법을 분석 중입니다... 🍃";
      ttsBtn.style.display = "none";

      const url = "https://api.openai.com/v1/chat/completions";

      try {
        const response = await fetch(url, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${OPENAI_API_KEY}`
          },
          body: JSON.stringify({
            model: "gpt-4o-mini",
            messages: [
              { role: "system", content: "너는 친절한 환경 전문가야. 유저가 입력한 쓰레기의 올바른 분리배출 방법, 버릴 때 주의할 점, 그리고 환경에 미치는 영향을 딱 3줄로 명확하게 존댓말로 요약해서 알려줘." },
              { role: "user", content: query }
            ],
            temperature: 0.7
          })
        });
        
        const data = await response.json();
        currentAiResponse = data.choices[0].message.content;
        
        resultDisplay.innerText = currentAiResponse;
        ttsBtn.style.display = "block";

        saveEcoAction(query); // Realtime DB 저장 함수 호출
        inputEl.value = "";

      } catch (error) {
        resultDisplay.innerText = "에러가 발생했습니다. API 키나 크레딧을 확인해 주세요.";
        console.error(error);
      }
    }

    // 🌟 변경됨: Realtime DB 데이터 적재 함수
    function saveEcoAction(item) {
      if (!currentUser) return;
      const userRef = db.ref("users/" + currentUser.uid);
      
      // 트랜잭션을 사용하여 기존 점수에 안전하게 +10점
      userRef.child("score").transaction((currentScore) => {
        return (currentScore || 0) + 10;
      });

      // 새로운 검색 기록 추가 (밀리초 단위 타임스탬프 포함)
      userRef.child("history").push({
        item: item,
        timestamp: firebase.database.ServerValue.TIMESTAMP
      });
    }

    // TTS 기능
    function speakResult() {
      if (!currentAiResponse) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(currentAiResponse);
      utterance.lang = 'ko-KR';
      utterance.rate = 1.0;
      window.speechSynthesis.speak(utterance);
    }
  </script>
</body>
</html>
